<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FitFuel">
<title>FitFuel · Calories, meal plan and training</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d62828'/%3E%3Cpath d='M18 4 8 18h7l-2 10 11-15h-7z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f3f4f6;--surface:#ffffff;--surface2:#eceef1;--ink:#12161a;--muted:#5b6671;--line:#dfe3e8;
  --accent:#d62828;--accent-deep:#a31616;--accent-lt:#ff6b6b;--accent-text:var(--accent-deep);--on-accent:#0b0d0f;
  --accent-soft:color-mix(in srgb,var(--accent) 16%,transparent);
  --protein:#1f8a74;--carbs:#c97a0c;--fat:#6b56d0;--ok:#1b8a5f;--warn:#cc3d35;
  --radius:16px;--shadow:0 1px 2px rgba(10,15,20,.06),0 8px 24px rgba(10,15,20,.06);
  --head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0f12;--surface:#151a1f;--surface2:#1d242b;--ink:#eef1f4;--muted:#95a1ac;--line:#262e36;
  --accent-text:var(--accent-lt);
  --protein:#4fd1b4;--carbs:#ffb454;--fat:#ab9eff;--ok:#38d39a;--warn:#ff6b61;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{font-family:var(--head);margin:0;line-height:1.1;letter-spacing:.01em;text-wrap:balance}
h1{font-size:34px;font-weight:700;text-transform:uppercase}
h2{font-size:24px;font-weight:700;text-transform:uppercase}
h3{font-size:19px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center}.gap{gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.end{justify-content:flex-end}
.stack{display:grid;gap:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* buttons and inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:15px;min-height:44px;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:var(--warn);color:#fff}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:inline-grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--surface2)}
.icon-btn:disabled{opacity:.35;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent-text);font-weight:600;text-decoration:underline;font-size:inherit}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:90px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px}
label.field{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;min-height:36px}
.seg button[aria-pressed="true"],.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text);letter-spacing:.04em}
.chip.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}

/* cards */
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.panel{display:grid;gap:12px}
.card h2,.panel h2{font-size:21px}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
ul.tight{margin:0;padding-left:18px;display:grid;gap:5px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.err{color:var(--warn);font-size:14px}.okc{color:var(--ok);font-weight:600}.over{color:var(--over,var(--warn));font-weight:600}

/* app shell */
.shell{min-height:100vh;display:grid;grid-template-columns:1fr}
.side{display:none}
.main{min-width:0;padding-bottom:84px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:18px}
.content{max-width:760px;margin:0 auto;padding:18px 16px;display:grid;gap:16px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0)}
.tabbar button{background:none;border:0;padding:9px 2px 8px;display:grid;place-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);border-top:2px solid transparent}
.tabbar button[aria-current="page"]{color:var(--accent-text);border-top-color:var(--accent)}
@media(min-width:900px){
  .shell{grid-template-columns:240px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;padding:20px 14px;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line)}
  .side .brand{padding:4px 10px 18px}
  .side button.nav{display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px 14px;border-radius:12px;font-weight:600;font-size:15px;color:var(--muted);text-align:left}
  .side button.nav:hover{background:var(--surface2)}
  .side button.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
  .tabbar{display:none}.main{padding-bottom:30px}
  .top .brand{display:none}.top{justify-content:flex-end}
  .content{padding:26px 24px;max-width:860px}
}

/* profile chooser */
.chooser{min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:
  radial-gradient(900px 500px at 15% -10%,rgba(214,40,40,.28),transparent 60%),
  radial-gradient(900px 500px at 95% 110%,rgba(248,165,200,.24),transparent 60%),#0a0d10;color:#eef1f4}
.chooser-in{width:100%;max-width:760px;display:grid;gap:26px;text-align:center}
.chooser .brand{justify-content:center;font-size:34px}
.chooser h1{font-size:clamp(34px,7vw,56px)}
.chooser .lead{color:#a6b1bb;max-width:460px;margin:0 auto}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.pcards{grid-template-columns:1fr}}
.pcard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:26px 18px;display:grid;gap:10px;justify-items:center;color:inherit;transition:transform .15s,border-color .15s,background .15s}
.pcard:hover{transform:translateY(-3px);background:rgba(255,255,255,.08);border-color:var(--pc)}
.pcard .avatar{width:84px;height:84px;font-size:46px;background:var(--pc);color:var(--pt,#0b0d0f)}
.pcard h2{font-size:30px}
.pcard .stat{font-size:13px;color:#a6b1bb}
.chooser .foot{font-size:12px;color:#7f8b96}

/* summary ring and bars */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:linear-gradient(135deg,var(--surface),color-mix(in srgb,var(--accent) 10%,var(--surface)))}
@media(max-width:520px){.hero{grid-template-columns:1fr}.hero .ring{justify-self:center}}
.hero h1{font-size:30px;margin:4px 0 6px}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:11}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round}
.ring-fg.over{stroke:var(--over,var(--warn))}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-family:var(--head);font-size:34px;line-height:1}
.ring-c span{font-size:12px;color:var(--muted)}
.bars{display:grid;gap:11px}
.bar .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:99px}
.eq{display:grid;grid-template-columns:repeat(var(--n,5),auto);gap:4px;align-items:center;justify-content:space-between;text-align:center}
.eq b{display:block;font-family:var(--head);font-size:26px;line-height:1.1}
.eq span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.eq i{font-style:normal;color:var(--muted);font-size:20px}
.eq .rem b{color:var(--accent-text)}.eq .rem.over b{color:var(--over,var(--warn))}

/* diary */
.slot-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.slot-head h3{font-size:22px;text-transform:uppercase}
.slot-head .kc{font-family:var(--head);font-size:22px}
.entry{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit}
.entry:hover{background:var(--surface2)}
.entry .t{font-weight:600}.entry .s{font-size:12px;color:var(--muted)}
.entry .k{font-weight:700;text-align:right}.entry .mm{font-size:12px;color:var(--muted);text-align:right}
.add-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.water{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.glass{width:26px;height:34px;border-radius:5px 5px 9px 9px;border:2px solid var(--line);background:transparent}
.glass.on{background:#4aa8ff;border-color:#4aa8ff}

/* plan */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.days button{flex:1 0 auto;min-width:54px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 6px;display:grid;gap:1px;text-align:center}
.days button b{font-family:var(--head);font-size:18px;text-transform:uppercase}
.days button span{font-size:11px;color:var(--muted)}
.days button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pitem{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.pitem:last-child{border-bottom:0}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;display:grid;place-items:center}
.stepper span{min-width:38px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* sheets, toasts */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:94vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;border:1px solid var(--line)}
.sheet.small{max-width:440px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:22px}
.sheet-body{overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.toasts{position:fixed;left:0;right:0;bottom:92px;display:grid;justify-items:center;gap:8px;z-index:200;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:var(--shadow);max-width:92vw}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:0}
.banner{background:var(--warn);color:#fff;padding:10px 16px;font-size:14px;text-align:center}
.picker-tabs{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;min-height:44px;padding-bottom:2px;scrollbar-width:none}.picker-tabs button{flex:0 0 auto;white-space:nowrap}
.result{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-top:0;border-left:0;border-right:0;color:inherit}
.result:hover{background:var(--surface2)}
.result .t{font-weight:600}.result .s{font-size:12px;color:var(--muted)}.result .k{text-align:right;font-weight:700;white-space:nowrap}
.bigkcal{font-family:var(--head);font-size:44px;line-height:1}
.macros3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.macros3 div{background:var(--surface2);border-radius:12px;padding:8px}
.macros3 b{display:block;font-family:var(--head);font-size:22px}
.macros3 span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bd-item{display:grid;grid-template-columns:1fr 84px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:11px var(--body);fill:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface2);border-radius:12px;padding:10px;display:grid;gap:2px;min-width:0}
.tile .eyebrow{font-size:10px;letter-spacing:.06em}
.tv{font-family:var(--head);font-size:28px;line-height:1.05}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}

/* workouts */
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .sets{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.ex .how{grid-column:1/-1;font-size:13px;color:var(--muted)}
.sx{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.sx:last-child{border-bottom:0}
.sx .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sets-row{display:flex;gap:8px;flex-wrap:wrap}
.setbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface2);overflow:hidden}
.setbox input[type=number]{width:52px;border:0;background:transparent;padding:8px 6px;text-align:center;min-height:38px;border-radius:0}
.setbox button{border:0;border-left:1px solid var(--line);background:transparent;width:40px;height:38px;color:var(--muted)}
.setbox.done{border-color:var(--ok)}
.setbox.done button{background:var(--ok);color:#06110c;border-left-color:var(--ok)}

/* guide blocks copied from Daawood's plan */
.day{display:grid;gap:8px}
.meal{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal .when{font-size:12px;color:var(--muted);font-weight:600;padding-top:2px}
.meal .what{min-width:0}
.meal .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
td:first-child{min-width:44px}
th{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* mobile plan rows, FAB */
@media(max-width:560px){.pitem{grid-template-columns:1fr}.pitem>.row.end{justify-content:flex-start}}
.card>.row.between{flex-wrap:wrap;gap:6px 12px}
.fab{position:fixed;right:16px;bottom:78px;z-index:35;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.fab .i{width:26px;height:26px;stroke-width:2.6}
@media(min-width:900px){.fab{bottom:24px;right:28px}}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{display:grid;justify-items:center;gap:6px;padding:18px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-weight:600}
.qa button .i{width:26px;height:26px;color:var(--accent-text)}

input[type=checkbox]{accent-color:var(--accent)}

/* red theme: use amber for 'over target' so it differs from the accent */
:root[data-profile="daawood"]{--over:#b86b00}
:root[data-profile="daawood"][data-theme="dark"]{--over:#ffb020}
/* iPhone zooms in on any input under 16px when it is tapped */
input,select,textarea,input[type=text],input[type=number],input[type=search],input[type=date],input[type=time],input[type=password],input[type=email]{font-size:16px!important}
textarea{font-family:var(--body)!important}
html,body{max-width:100%;overflow-x:hidden}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

</style>
</head>

<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></symbol>

/* ===== food and meal maths ===== */
const getFood=fk=>(P&&P.foods.find(f=>f.key===fk))||FOODS[fk];
function itemFrom(food,g){
  return {fk:food.key,n:food.n,g:r1(g),k:r0(food.k*g/100),p:r1(food.p*g/100),c:r1(food.c*g/100),f:r1(food.f*g/100)};
}
function sumT(list){
  const t={k:0,p:0,c:0,f:0};
  list.forEach(x=>{t.k+=x.k||0;t.p+=x.p||0;t.c+=x.c||0;t.f+=x.f||0});
  return {k:r0(t.k),p:r1(t.p),c:r1(t.c),f:r1(t.f)};
}
const mealTot=m=>sumT(m.items);
const scaleT=(t,m)=>({k:r0(t.k*m),p:r1(t.p*m),c:r1(t.c*m),f:r1(t.f*m)});
function entryTot(e){
  const m=e.unit==='g'?e.amt/100:e.amt;
  return {k:r0(e.base.k*m),p:r1(e.base.p*m),c:r1(e.base.c*m),f:r1(e.base.f*m)};
}
const entryDesc=e=>e.unit==='g'?`${r1(e.amt)} g`:(e.amt===1?'1 serving':`${r1(e.amt)}× serving`);

/* ===== targets ===== */
const ACT={sedentary:['Mostly sitting',1.2],light:['Light (1–3 workouts a week)',1.375],moderate:['Moderate (3–5 workouts a week)',1.55],active:['Very active (6–7 workouts a week)',1.725]};
const GOALS={tone:['Tone and firm up (lean, not bulky)',-200],slow:['Lose weight slowly',-275],lose:['Lose weight',-550],maintain:['Maintain weight',0],gain:['Build muscle slowly',250]};
function calcTargets(st){
  const w=num(st.weight),h=num(st.height),a=num(st.age);
  if(!w||!h||!a)return null;
  const bmr=10*w+6.25*h-5*a+(st.sex==='m'?5:-161);
  const tdee=bmr*ACT[st.activity][1];
  let k=tdee+GOALS[st.goal][1];
  k=Math.max(k,st.sex==='m'?1500:1400);
  k=Math.round(k/10)*10;
  let p=Math.min(1.8*w,.35*k/4);p=Math.round(p);
  const f=Math.round(.27*k/9);
  const c=Math.max(0,Math.round((k-4*p-9*f)/4));
  return {k,p,c,f,water:2500,tdee:Math.round(tdee)};
}

const D=date=>(P.diary[date])||{entries:[],water:0,ex:[]};
function DW(date){
  if(!P.diary[date])P.diary[date]={entries:[],water:0,ex:[]};
  const d=P.diary[date];d.entries=d.entries||[];d.ex=d.ex||[];d.water=d.water||0;d.m=Date.now();return d;
}
function dayTot(date){const d=D(date);return sumT(d.entries.map(entryTot))}
const exTot=date=>D(date).ex.reduce((a,e)=>a+(e.k||0),0);
const hasLog=date=>D(date).entries.length>0;
function streak(){
  let d=today(),n=0;
  if(!hasLog(d))d=addDays(d,-1);
  while(hasLog(d)){n++;d=addDays(d,-1)}
  return n;
}
function addEntry(date,slot,e){
  const d=DW(date);e.id=uid();e.slot=slot;d.entries.push(e);save();return e.id;
}
function entryFromMeal(m,mult){
  return {name:m.name,unit:'x',amt:mult,base:mealTot(m),mid:m.id};
}
function entryFromFood(food,g){

}
function entryFromItem(it){
  // a meal item or quick item
  if(it.fk&&getFood(it.fk)&&it.g){const f=getFood(it.fk);return entryFromFood(f,it.g)}

/* ===== meals ===== */
function ensureMeal(items,name,slot){
  if(items.length===1){
    const it=items[0];
    const hit=P.meals.find(m=>m.items.length===1&&m.items[0].fk===it.fk&&m.items[0].g===it.g&&m.items[0].k===it.k&&m.name===name);
    if(hit)return hit;
  }
  const m={id:uid(),name,slot,note:'',items};
  P.meals.push(m);save();return m;
}
const mealById=id=>P.meals.find(m=>m.id===id);
function recents(limit=40){
  const seen=new Set(),out=[];
  const dates=Object.keys(P.diary).sort().reverse();
  for(const dt of dates){
    const es=[...D(dt).entries].reverse();
    for(const e of es){
      const key=(e.fk||e.mid||e.name)+'|'+e.unit;
      if(seen.has(key))continue;seen.add(key);out.push(e);
      if(out.length>=limit)return out;
    }
  }
  return out;
}
function frequentNames(){
  const c={};
  Object.values(P.diary).forEach(d=>d.entries.forEach(e=>{const k=e.name;c[k]=(c[k]||0)+1}));
  return c;
}

/* ===== auto plan ===== */
function autoPlan(){
  const T=P.targets,plan=emptyPlan();
  const last={breakfast:[],lunch:[],dinner:[],snacks:[]};
  const kOf=it=>{const m=mealById(it.mid);return m?mealTot(m).k*it.mult:0};
  const pOf=it=>{const m=mealById(it.mid);return m?mealTot(m).p*it.mult:0};
  for(let d=0;d<7;d++){
    for(const slot of SLOTS){
      const pool=P.meals.filter(m=>m.slot===slot);
      if(!pool.length)continue;
      const tk=T.k*SHARE[slot],tp=T.p*SHARE[slot];
      let best=null;
      for(const m of pool){
        const t=mealTot(m);if(t.k<=0)continue;
        for(let mult=.5;mult<=2.001;mult+=.25){
          const k=t.k*mult,p=t.p*mult;
          let sc=Math.abs(k-tk)/tk+.12*Math.abs(mult-1)-.15*Math.min(1,p/tp);
          if(k>tk)sc+=.4*(k-tk)/tk;
          if(last[slot].slice(-2).includes(m.id))sc+=.6;
          if(!best||sc<best.sc)best={sc,m,mult};
        }
      }
      if(best){plan[d][slot]=[{id:uid(),mid:best.m.id,mult:best.mult}];last[slot].push(best.m.id)}
    }
    // bring the whole day within about 3% of the calorie goal by nudging portion sizes
    const items=SLOTS.flatMap(s=>plan[d][s]);
    for(let i=0;i<16&&items.length;i++){
      const tot=items.reduce((a,it)=>a+kOf(it),0),diff=T.k-tot;
      if(Math.abs(diff)<=T.k*.03)break;
      let pick=null;
      for(const it of items){
        const nm=Math.round((it.mult+(diff>0?.25:-.25))*100)/100;
        if(nm<.5||nm>2)continue;
        const m=mealById(it.mid),nd=Math.abs(diff-(mealTot(m).k*(nm-it.mult)*(diff>0?1:1)));
        const gain=Math.abs(diff)-Math.abs(diff-mealTot(m).k*(nm-it.mult));
        if(gain<=0)continue;
        const pRatio=pOf(it)/Math.max(1,kOf(it));
        const sc=gain+(diff<0?-pRatio*40:pRatio*40);
        if(!pick||sc>pick.sc)pick={it,nm,sc};
      }
      if(!pick)break;
      pick.it.mult=pick.nm;
    }
  }
  P.plan=plan;save();
}
function planDayTot(d){
  const t={k:0,p:0,c:0,f:0};
  for(const s of SLOTS)for(const it of P.plan[d][s]){
    const m=mealById(it.mid);if(!m)continue;
    const x=scaleT(mealTot(m),it.mult);t.k+=x.k;t.p+=x.p;t.c+=x.c;t.f+=x.f;
  }
  return {k:r0(t.k),p:r1(t.p),c:r1(t.c),f:r1(t.f)};
}

/* ===== weights, stats ===== */
const sortedWeights=()=>[...P.weights].sort((a,b)=>a.d.localeCompare(b.d));
function rangeStats(n){
  const days=[];
  for(let i=n-1;i>=0;i--)days.push(addDays(today(),-i));
  const rows=days.map(d=>({d,...dayTot(d),logged:hasLog(d)}));
  const lg=rows.filter(r=>r.logged);
  const T=P.targets;
  return {rows,logged:lg.length,
    avgK:lg.length?r0(lg.reduce((a,r)=>a+r.k,0)/lg.length):0,
    avgP:lg.length?r0(lg.reduce((a,r)=>a+r.p,0)/lg.length):0,
    avgC:lg.length?r0(lg.reduce((a,r)=>a+r.c,0)/lg.length):0,
    avgF:lg.length?r0(lg.reduce((a,r)=>a+r.f,0)/lg.length):0,
    onTarget:lg.filter(r=>r.k<=T.k*1.05&&r.p>=T.p*.9).length};
}

const METS=[

  [/\b(cycle|cycling|bike|biking|spin|spinning)/,7.5,'Cycling'],
  [/\bswim/,6,'Swimming'],
  [/\b(rowing|row machine|rower)/,7,'Rowing'],

  [/\b(strength|weights?|weight training|lifting|dumbbells?|resistance|gym)/,5,'Strength training'],
  [/\b(football|soccer)/,7,'Football'],

  [/\b(martial|karate|judo|taekwondo)/,5.3,'Martial arts'],
  [/\b(housework|cleaning|mopping|vacuum)/,3.3,'Housework'],
  [/\b(garden|gardening)/,3.8,'Gardening'],
  [/\bcardio/,6,'Cardio']
];
const KMMIN={'Running':6,'Jogging':7,'Brisk walking':9.5,'Walking':11,'Hiking':15,'Cycling':3.5};
function burnWeight(){
  const w=sortedWeights().slice(-1)[0];
  if(w)return {kg:w.v,assumed:false};
  const s=num(P.stats.weight);if(s)return {kg:s,assumed:false};
  return {kg:S.cur==='daawood'?80:65,assumed:true};
}
function parseMinutes(t){
  t=t.toLowerCase();let m;
  if(m=t.match(/(\d+(?:[.,]\d+)?)\s*(?:h|hr|hrs|hour|hours)\s*(\d+)\s*(?:m|min|mins|minutes?)?\b/))return num(m[1])*60+num(m[2]);
  if(m=t.match(/(\d+(?:[.,]\d+)?)\s*(?:h|hr|hrs|hour|hours)\b/))return num(m[1])*60;
  if(m=t.match(/(\d+(?:[.,]\d+)?)\s*(?:m|min|mins|minutes?)\b/))return num(m[1]);
  if(/half an hour|half hour/.test(t))return 30;
  if(/quarter of an hour/.test(t))return 15;
  if(/\b(an|one) hour\b/.test(t))return 60;
  return 0;
}
function burnMets(kg,met,mins){return Math.max(0,r0((met-1)*kg*mins/60))}
function estimateBurn(text,minutesField,effort){
  const t=(text||'').toLowerCase().trim();
  let met=null,label='';
  for(const [re,mt,lb] of METS)if(re.test(t)){met=mt;label=lb;break}
  let mins=num(minutesField)||parseMinutes(t);
  const km=t.match(/(\d+(?:[.,]\d+)?)\s*(?:km|kilomet(?:re|er)s?)\b/);
  const mi=t.match(/(\d+(?:[.,]\d+)?)\s*miles?\b/);
  const st=t.match(/(\d[\d, ]*)\s*steps?\b/);
  if(!mins&&st){mins=num(st[1].replace(/[ ,]/g,''))/100;if(!met){met=3.5;label='Walking'}}
  if(!mins&&(km||mi)&&KMMIN[label])mins=num((km||mi)[1])*(mi&&!km?1.609:1)*KMMIN[label];
  if(!t&&!mins)return {err:'Describe what you did and for how long, for example “brisk walk 40 minutes”.'};
  let general=false;
  if(!met){met=4;label='General exercise';general=true}
  if(!mins)return {err:'How long did you do it for? Add the minutes, for example “'+(label==='General exercise'?'30 minutes':label.toLowerCase()+' 30 minutes')+'”.'};
  let f=1;
  const e=effort||'mod';
  if(e==='easy')f=.8;else if(e==='hard')f=1.2;
  else if(/\b(easy|light|gentle|slow|relaxed|casual)\b/.test(t))f=.8;
  else if(/\b(hard|intense|vigorous|heavy|fast|tough)\b/.test(t))f=1.2;
  const {kg,assumed}=burnWeight();
  const mt=Math.max(1.5,met*f);
  return {k:burnMets(kg,mt,mins),label,mins:r0(mins),met:r1(mt),kg,assumed,general};
}

/* ===== toast, sheets, confirm ===== */
function toast(msg,undo){
  const box=$('#toasts');const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');
  t.innerHTML=`<span>${esc(msg)}</span>`;
  if(undo){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{undo();t.remove();render()};t.appendChild(b)}
  box.appendChild(t);setTimeout(()=>t.remove(),undo?6000:2600);
}
function sheet(title,body,opt={}){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="sheet ${opt.small?'small':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Close">${ic('x')}</button></div><div class="sheet-body"></div></div>`;
  const bd=$('.sheet-body',ov);bd.innerHTML=body;
  $('#overlays').appendChild(ov);document.body.classList.add('noscroll');
  const api={el:ov,body:bd,close(){if(!ov.isConnected)return;ov.remove();if(!$('.overlay'))document.body.classList.remove('noscroll');opt.onClose&&opt.onClose()},set(h){bd.innerHTML=h}};
  ov.addEventListener('mousedown',e=>{if(e.target===ov)api.close()});
  $('[data-close]',ov).onclick=api.close;
  return api;
}
function closeAll(){$$('.overlay').forEach(o=>o.remove());document.body.classList.remove('noscroll')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=$$('.overlay').pop();if(o){o.remove();if(!$('.overlay'))document.body.classList.remove('noscroll')}}});
function confirmBox(title,msg,ok='Delete',danger=true){
  return new Promise(res=>{
    const sh=sheet(title,`<p>${esc(msg)}</p><div class="row gap end"><button class="btn ghost" data-no>Cancel</button><button class="btn ${danger?'danger':''}" data-yes>${esc(ok)}</button></div>`,{small:true,onClose:()=>res(false)});
    $('[data-no]',sh.el).onclick=()=>sh.close();
    $('[data-yes]',sh.el).onclick=()=>{res(true);sh.el.remove();if(!$('.overlay'))document.body.classList.remove('noscroll')};
  });
}

    const rmb=e.target.closest('[data-rm]');if(rmb){rmode=rmb.dataset.rm;list();return}
    const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;list();return}
    const go=e.target.closest('[data-go]');
    if(go){
      if(go.dataset.go==='quick')quickForm(ctx,sh);
      else foodForm(f=>{foodDetail(f,ctx,sh)},null);
      return;
    }
    const r=e.target.closest('.result');if(!r)return;
    const type=r.dataset.type,id=r.dataset.id;

}

/* ===== meal builder ===== */
function mealBuilder(opt={}){
  const src=opt.meal;
  const m=src?{...src,items:src.items.map(i=>({...i}))}:{id:uid(),name:'',slot:opt.slot||'lunch',note:'',items:[]};
  const sh=sheet(src?'Edit meal':'Create a meal','',{});
  function draw(){
    const t=sumT(m.items);
    sh.set(`
      <label class="field">Meal name<input type="text" id="mn" value="${esc(m.name)}" placeholder="e.g. Chicken and rice bowl"></label>
      <div class="grid2"><label class="field">Goes in<select id="ms">${SLOTS.map(s=>`<option value="${s}" ${m.slot===s?'selected':''}>${SLOTN[s]}</option>`).join('')}</select></label>
      <label class="field">Note (optional)<input type="text" id="mt" value="${esc(m.note||'')}"></label></div>
      <div><div class="eyebrow">Ingredients</div>
      ${m.items.length?m.items.map((i,ix)=>`<div class="bd-item"><span>${esc(i.n)}</span>${i.g?`<input type="number" data-ix="${ix}" value="${i.g}" inputmode="decimal" aria-label="Grams of ${esc(i.n)}">`:'<span class="muted small">fixed</span>'}<span class="num row gap">${i.k} kcal <button class="icon-btn" data-rm="${ix}" aria-label="Remove ${esc(i.n)}">${ic('x')}</button></span></div>`).join(''):'<p class="empty">No ingredients yet.</p>'}
      </div>
      <button class="btn ghost" id="madd1">${ic('plus')} Add food</button>
      <div class="card" style="box-shadow:none"><div class="bigkcal num">${t.k} <span class="muted small">kcal</span></div>${macroBlock(t)}</div>
      <p class="err" id="me"></p>
      <button class="btn block" id="msave">${opt.saveLabel||'Save meal'}</button>`);
  }
  function sync(){
    const n=$('#mn',sh.el);if(!n)return;
    m.name=n.value;m.slot=$('#ms',sh.el).value;m.note=$('#mt',sh.el).value;
  }
  sh.el.addEventListener('change',e=>{
    const ix=e.target.dataset&&e.target.dataset.ix;
    if(ix!==undefined&&ix!==''){
      sync();const it=m.items[ix],g=Math.max(1,num(e.target.value,it.g)),f=getFood(it.fk);
      if(f)m.items[ix]=itemFrom(f,g);else m.items[ix].g=g;
      draw();return;
    }
    if(e.target.id==='ms'||e.target.id==='mn'||e.target.id==='mt')sync();
  });
  sh.el.addEventListener('click',e=>{
    const rm=e.target.closest('[data-rm]');
    if(rm){sync();m.items.splice(+rm.dataset.rm,1);draw();return}
    if(e.target.closest('#madd1')){
      sync();
      openPicker({title:'Add to meal',meals:false,keepOpen:true,addLabel:'Add to meal',
        onFood:it=>{m.items.push(it);draw()},onQuick:it=>{m.items.push(it);draw()},
        doneMsg:n=>n+' added'});
      return;
    }
    if(e.target.closest('#msave')){
      sync();
      if(!m.name.trim()){$('#me',sh.el).textContent='Give the meal a name.';return}
      if(!m.items.length){$('#me',sh.el).textContent='Add at least one food.';return}
      m.name=m.name.trim();m.m=Date.now();
      if(src)Object.assign(src,m);else P.meals.push(m);
      save();sh.close();opt.onSave&&opt.onSave(src||m);render();
    }
  });
  draw();
}

/* ===== photo estimates (optional, uses the person's own Anthropic API key) ===== */
const AI_SYS=`You estimate calories and macros for a meal from a photo, for a South African user who eats halaal food and often cooks with oil or ghee. Identify each separate food item you can see, estimate its weight in grams from the plate, cup or packaging sizes, and give calories, protein, carbs and fat for that portion. Add a realistic allowance for hidden oil, ghee, butter, sauce or dressing when it is likely. If the user's note gives weights or ingredients, trust the note over the photo. Reply with JSON only, no other text, in exactly this shape: {"items":[{"name":"Grilled chicken breast","grams":150,"kcal":250,"protein":46,"carbs":0,"fat":5,"confidence":"high"}],"tip":"One short, practical tip for the person's fat-loss goal."} confidence is one of low, medium or high.`;
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const sc=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);

const DEFAULT_SYNC_URL="https://fitfuel-60ca8-default-rtdb.europe-west1.firebasedatabase.app";
/* ===== online sync (Firebase Realtime Database REST) =====
   Each profile is stored as one string under /fitfuel/<code>/<profile>.json so nothing is lost to
   Firebase's rules about empty arrays. Devices merge, so edits on two phones are kept. */
const HASH={};
let syncBusy=false,syncTimer=null,syncPoll=null,lastSyncToast=0;
const settingsHash=p=>JSON.stringify([p.targets,p.stats,p.prefs,p.plan,p.workouts&&p.workouts.program,p.onboarded]);
function initHashes(){for(const k of Object.keys(S.profiles))HASH[k]=settingsHash(S.profiles[k])}
function stampSettings(){
  for(const k of Object.keys(S.profiles)){
    const p=S.profiles[k],h=settingsHash(p);
    if(HASH[k]!==h){HASH[k]=h;p.sm=Date.now()}
  }
}
function cj(o){ // canonical JSON (sorted keys) so equal data compares equal on every device
  if(Array.isArray(o))return '['+o.map(cj).join(',')+']';
  if(o&&typeof o==='object')return '{'+Object.keys(o).sort().filter(k=>o[k]!==undefined).map(k=>JSON.stringify(k)+':'+cj(o[k])).join(',')+'}';
  return JSON.stringify(o);
}
function uni(A,B,idf,tomb,byM,tk){
  const map=new Map();
  for(const it of [...(A||[]),...(B||[])]){
    const id=idf(it),prev=map.get(id);
    if(!prev||(byM&&(it.m||0)>(prev.m||0)))map.set(id,it);
  }
  return [...map.values()]
    .filter(it=>{const t=tomb[tk?tk(it):idf(it)];return !t||(byM&&(it.m||0)>t)})
    .sort((x,y)=>String(idf(x)).localeCompare(String(idf(y))));
}
function mergeProfile(a,b){
  if(!b||typeof b!=='object'||!b.diary)return a;
  if((a.rs||0)>(b.rs||0))return a;
  if((b.rs||0)>(a.rs||0))return b;
  const out={...a};
  const tomb={...(a.tomb||{})};
  for(const k of Object.keys(b.tomb||{}))tomb[k]=Math.max(tomb[k]||0,b.tomb[k]);
  const cut=Date.now()-90*864e5;for(const k of Object.keys(tomb))if(tomb[k]<cut)delete tomb[k];
  out.tomb=tomb;
  const nb=(b.sm||0)>(a.sm||0)?b:a;
  out.sm=nb.sm||0;
  for(const f of ['targets','stats','prefs','plan','onboarded'])out[f]=nb[f];
  out.workouts={program:(nb.workouts||a.workouts).program,sessions:uni(a.workouts.sessions,(b.workouts||{}).sessions,x=>x.id,tomb)};
  out.meals=uni(a.meals,b.meals,x=>x.id,tomb,true);
  out.foods=uni(a.foods,b.foods,x=>x.key,tomb,true);
  out.weights=uni(a.weights,b.weights,x=>x.d,tomb,true,x=>'w:'+x.d);
  const dd={};
  for(const d of new Set([...Object.keys(a.diary||{}),...Object.keys(b.diary||{})])){
    const x=a.diary[d],y=(b.diary||{})[d];
    dd[d]=!x?y:!y?x:((y.m||0)>(x.m||0)?y:x);
  }
  out.diary=dd;
  return out;
}
const syncOn=()=>!!(S&&S.sync&&S.sync.on&&S.sync.url&&S.sync.code);
const rurl=k=>S.sync.url.replace(/\/+$/,'')+'/fitfuel/'+encodeURIComponent(S.sync.code)+'/'+k+'.json';
function validSyncUrl(u){
  if(!u)return 'Paste your database URL.';
  if(/^https:\/\/[^\s/]+\.(firebaseio\.com|firebasedatabase\.app)\/?$/i.test(u))return '';
  if(/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/?$/i.test(u))return '';
  return 'That does not look like a Firebase database URL. It should look like https://your-project-default-rtdb.firebaseio.com';
}
const genCode=()=>{const a=new Uint8Array(12);crypto.getRandomValues(a);return [...a].map(x=>'abcdefghjkmnpqrstuvwxyz23456789'[x%31]).join('')};

async function syncNow(manual){
  if(!syncOn()||syncBusy)return;
  if($('.overlay')||$('#setupform')){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(manual),4000);return}
  syncBusy=true;let changed=false,err='';
  try{
    for(const k of Object.keys(PROFILES)){
      const r=await fetch(rurl(k),{cache:'no-store'});
      if(!r.ok)throw new Error(r.status===401||r.status===403?'The database refused access. Check the rules in Firebase.':'Server answered '+r.status);
      const j=await r.json();let remote=null;
      if(j&&typeof j.d==='string'){try{remote=JSON.parse(j.d)}catch(e){}}
      const local=S.profiles[k];
      const merged=mergeProfile(local,remote);
      const mj=cj(merged);
      if(cj(local)!==mj){
        for(const key of Object.keys(local))delete local[key];
        Object.assign(local,JSON.parse(mj));changed=true;
      }
      if(!remote||cj(remote)!==mj){
        const pr=await fetch(rurl(k),{method:'PUT',body:JSON.stringify({v:1,m:Date.now(),d:mj})});
        if(!pr.ok)throw new Error('Could not save to the database ('+pr.status+')');
      }
    }
    S.sync.last=Date.now();
  }catch(e){
    err=(e&&e.message)||'No connection';
    if(/Failed to fetch|NetworkError|Load failed/i.test(err))err='No connection to the database.';
  }
  syncBusy=false;S.sync.err=err;
  initHashes();persist();syncDirty=false;
  if(err&&(manual||Date.now()-lastSyncToast>300000)){lastSyncToast=Date.now();toast('Sync problem: '+err)}
  else if(manual&&!err)toast('Synced');
  if(changed||V.view==='me'){if(!$('.overlay')&&!$('#setupform')&&S.cur)render()}
}

  const u=new Date(),ds=`${u.getUTCFullYear()}${pad2(u.getUTCMonth()+1)}${pad2(u.getUTCDate())}T${pad2(u.getUTCHours())}${pad2(u.getUTCMinutes())}${pad2(u.getUTCSeconds())}Z`;
  const t0=today().replace(/-/g,''),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FitFuel//Reminders//EN','CALSCALE:GREGORIAN'];

function shopData(range){

  const map=new Map();

function sessionSheet(w){
  const prog=PROGRAMS[P.workouts.program],list=prog.W[w];
  const sh=sheet(`Workout ${w} · ${prog.names[w]}`,'');
  const st=list.map(([n,s])=>({n,s,sets:Array.from({length:parseInt(s)||3},()=>({r:'',done:false}))}));
  sh.set(st.map((e,ei)=>{
    const ph=(e.s.split('×')[1]||'').trim().split(' ')[0]||'reps';
    return `<div class="sx"><div class="hd"><b>${esc(e.n)}</b><span class="muted small">${esc(e.s)}</span></div><div class="sets-row">${e.sets.map((x,si)=>`<div class="setbox" data-e="${ei}" data-s="${si}"><input type="number" inputmode="numeric" placeholder="${esc(ph)}" aria-label="${esc(e.n)} set ${si+1}"><button type="button" aria-label="Mark set ${si+1} done">${ic('check')}</button></div>`).join('')}</div></div>`}).join('')+
    `<div class="grid2"><label class="field">How long did it take? (min)<input type="number" id="smin" inputmode="numeric" value="30"></label><label class="field">Burned calories<select id="sadd"><option value="1">Add to my diary</option><option value="0">Don’t add</option></select></label></div><p class="small muted">Calories burned are estimated from your weight and time.</p><p class="err" id="se2"></p><button class="btn block" id="sfin">Finish and save</button>`);
  sh.el.addEventListener('input',e=>{const b=e.target.closest('.setbox');if(b)st[b.dataset.e].sets[b.dataset.s].r=e.target.value});
  sh.el.addEventListener('click',e=>{
    const b=e.target.closest('.setbox button');
    if(b){const bx=b.parentElement,x=st[bx.dataset.e].sets[bx.dataset.s];x.done=!x.done;bx.classList.toggle('done',x.done);return}
    if(e.target.closest('#sfin')){
      const dn=st.reduce((a,x)=>a+x.sets.filter(y=>y.done).length,0);
      if(!dn){$('#se2',sh.el).textContent='Tick at least one set to save the workout.';return}
      P.workouts.sessions.push({id:uid(),d:today(),w,prog:P.workouts.program,ex:st.map(x=>({n:x.n,sets:x.sets.map(y=>({r:y.r?num(y.r):'',done:y.done}))}))});
      let msg='Workout saved';
      if($('#sadd',sh.el).value==='1'){
        const mins=Math.max(5,num($('#smin',sh.el).value,30)),{kg}=burnWeight(),kc=burnMets(kg,prog.met||4.5,mins);
        if(kc>0){DW(today()).ex.push({id:uid(),name:`Workout ${w} · ${prog.names[w]}`,k:kc});msg=`Workout saved. About ${kc} kcal burned added to your diary.`}
      }
      save();sh.close();V.sub.fit='history';toast(msg);render();
    }
  });
}

/* ===== charts ===== */
function svgBars(rows,target){
  const W=340,H=170,L=34,R=8,T=10,B=22,n=rows.length;
  const mx=Math.max(target*1.25,...rows.map(r=>r.k)),bw=(W-L-R)/n;
  const Y=v=>T+(1-v/mx)*(H-T-B);
  let s=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories per day compared with your goal">`;
  [0,.5,1].forEach(f=>{const v=mx*f;s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${L-4}" y="${Y(v)+4}" text-anchor="end">${nf(v)}</text>`});
  rows.forEach((r,i)=>{
    const x=L+i*bw+bw*.15,w=bw*.7,h=Math.max(0,(H-B)-Y(r.k));
    const over=r.k>target*1.05,info=`${fmtD(r.d)}: ${r.logged?nf(r.k)+' kcal, P '+r0(r.p)+' g':'nothing logged'}`;
    s+=`<g data-act="cinfo" data-t="${esc(info)}" style="cursor:pointer"><rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>${r.logged?`<rect x="${x}" y="${H-B-h}" width="${w}" height="${h}" rx="3" style="fill:${over?'var(--over,var(--warn))':'var(--accent)'}"/>`:''}</g>`;
    if(n<=14||i%5===0)s+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${n<=7?DOW[dow(r.d)][0]:parseD(r.d).getDate()}</text>`;
  });
  s+=`<line x1="${L}" x2="${W-R}" y1="${Y(target)}" y2="${Y(target)}" stroke-dasharray="4 4" style="stroke:var(--ink);opacity:.6"/><text x="${W-R}" y="${Y(target)-4}" text-anchor="end">goal ${nf(target)}</text></svg></div>`;
  return s;
}
function svgLine(pts,goal){
  const W=340,H=180,L=38,R=10,T=12,B=24;
  const vs=pts.map(p=>p.v).concat(goal?[goal]:[]);
  let mn=Math.min(...vs),mx=Math.max(...vs);const pd=Math.max(.5,(mx-mn)*.15);mn-=pd;mx+=pd;
  const t0=parseD(pts[0].d).getTime(),span=Math.max(1,parseD(pts[pts.length-1].d).getTime()-t0);
  const X=d=>pts.length===1?(L+W-R)/2:L+(parseD(d).getTime()-t0)/span*(W-L-R);
  const Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  let s=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time">`;
  [0,.5,1].forEach(f=>{const v=mn+(mx-mn)*f;s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${L-4}" y="${Y(v)+4}" text-anchor="end">${r1(v)}</text>`});
  if(goal)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(goal)}" y2="${Y(goal)}" stroke-dasharray="4 4" style="stroke:var(--ok)"/><text x="${W-R}" y="${Y(goal)-4}" text-anchor="end" style="fill:var(--ok)">goal ${goal}</text>`;
  if(pts.length>1)s+=`<polyline fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>X(p.d)+','+Y(p.v)).join(' ')}"/>`;
  pts.forEach(p=>{s+=`<g data-act="cinfo2" data-t="${esc(fmtD(p.d)+': '+p.v+' kg')}" style="cursor:pointer"><circle cx="${X(p.d)}" cy="${Y(p.v)}" r="14" fill="transparent"/><circle cx="${X(p.d)}" cy="${Y(p.v)}" r="4" style="fill:var(--accent)"/></g>`});
  s+=`<text x="${L}" y="${H-6}">${fmtD(pts[0].d)}</text>`;
  if(pts.length>1)s+=`<text x="${W-R}" y="${H-6}" text-anchor="end">${fmtD(pts[pts.length-1].d)}</text>`;
  return s+'</svg></div>';
}

}
function exportSheet(){
  const txt=exportJSON();
  const sh=sheet('Back up',`<p class="muted small">Download the file, or copy the text and keep it somewhere safe (a note to yourself or email). It contains both profiles.</p>
    <textarea id="xt" readonly>${esc(txt)}</textarea>
    <div class="row gap wrap"><button class="btn" id="xd">Download file</button><button class="btn ghost" id="xc">Copy text</button></div><p class="small okc" id="xm"></p>`);
  $('#xd',sh.el).onclick=()=>{
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=`fitfuel-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();$('#xm',sh.el).textContent='Download started. If nothing happened, use Copy text instead.'}
    catch(e){$('#xm',sh.el).textContent='Download is blocked here. Use Copy text instead.'}
  };
  $('#xc',sh.el).onclick=async()=>{
    const ta=$('#xt',sh.el);
    try{await navigator.clipboard.writeText(txt);$('#xm',sh.el).textContent='Copied.'}
    catch(e){ta.select();try{document.execCommand('copy');$('#xm',sh.el).textContent='Copied.'}catch(_){$('#xm',sh.el).textContent='Select the text and copy it manually.'}}
  };
}
function importSheet(){
  const sh=sheet('Restore from backup',`<p class="muted small">Paste the backup text below, or choose a backup file. This replaces what is on this device now.</p>
    <textarea id="it" placeholder="Paste backup text here"></textarea>
    <input type="file" id="if" accept=".json,application/json">
    <p class="err" id="im"></p><button class="btn block" id="ig">Restore</button>`);
  $('#if',sh.el).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#it',sh.el).value=r.result};r.readAsText(f)};
  $('#ig',sh.el).onclick=async()=>{
    const txt=$('#it',sh.el).value.trim();if(!txt){$('#im',sh.el).textContent='Paste your backup first.';return}
    if(!await confirmBox('Replace current data?','Everything on this device will be replaced by the backup.','Restore',false))return;
    const err=importJSON(txt);
    if(err){$('#im',sh.el).textContent=err;return}
    closeAll();toast('Backup restored');render();
  };
}
function planPickSheet(m){
  const sh=sheet('Add to plan',`<p class="muted small">${esc(m.name)} · ${esc(SLOTN[m.slot])}. Choose the days.</p>
    <div class="seg" id="pdays">${DOW.map((n,i)=>`<button data-i="${i}" aria-pressed="false">${n}</button>`).join('')}</div>
    <div class="row gap"><button class="btn ghost sm" id="pwk">Weekdays</button><button class="btn ghost sm" id="pall">Every day</button></div>
    <p class="err" id="pe"></p><button class="btn block" id="pgo">Add to plan</button>`,{small:true});
  const set=i=>{const b=$(`#pdays [data-i="${i}"]`,sh.el);return b};
  sh.el.addEventListener('click',e=>{
    const b=e.target.closest('#pdays button');if(b){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');return}
    if(e.target.closest('#pwk'))for(let i=0;i<7;i++)set(i).setAttribute('aria-pressed',i<5);
    if(e.target.closest('#pall'))for(let i=0;i<7;i++)set(i).setAttribute('aria-pressed',true);
  });
  $('#pgo',sh.el).onclick=()=>{
    const ds=[];for(let i=0;i<7;i++)if(set(i).getAttribute('aria-pressed')==='true')ds.push(i);
    if(!ds.length){$('#pe',sh.el).textContent='Pick at least one day.';return}
    ds.forEach(d=>pushPlan(d,m.slot,m.id,1));sh.close();toast(`${m.name} added to ${ds.length} day${ds.length>1?'s':''}`);V.sub.plan='week';render();
  };
}

function copyDaySheet(){
  const from=V.pday;
  const sh=sheet(`Copy ${DOWL[from]}`,`<p class="muted small">This replaces the plan on the days you pick with ${DOWL[from]}’s plan.</p>
    <div class="seg" id="cdays">${DOW.map((n,i)=>i===from?'':`<button data-i="${i}" aria-pressed="false">${n}</button>`).join('')}</div>
    <p class="err" id="ce"></p><button class="btn block" id="cgo">Copy</button>`,{small:true});
  sh.el.addEventListener('click',e=>{const b=e.target.closest('#cdays button');if(b)b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')});
  $('#cgo',sh.el).onclick=()=>{
    const ds=$$('#cdays button[aria-pressed=true]',sh.el).map(b=>+b.dataset.i);
    if(!ds.length){$('#ce',sh.el).textContent='Pick at least one day.';return}
    const old=JSON.stringify(P.plan);
    ds.forEach(d=>{P.plan[d]={};for(const sl of SLOTS)P.plan[d][sl]=P.plan[from][sl].map(it=>({...it,id:uid()}))});
    save();sh.close();toast(`Copied to ${ds.length} day${ds.length>1?'s':''}`,()=>{P.plan=JSON.parse(old);save()});render();
  };
}
function copyToSheet(slot){
  const src=D(V.date).entries.filter(e=>e.slot===slot);
  const def=V.date===today()?addDays(today(),-1):today();
  const sh=sheet(`Copy ${SLOTN[slot].toLowerCase()}`,`<p class="muted small">Copies ${src.length} item${src.length>1?'s':''} to another day. They are added to anything already logged there.</p>
    <label class="field">Date<input type="date" id="cd" value="${def}" max="${today()}"></label>
    <label class="field">Meal<select id="cs">${SLOTS.map(x=>`<option value="${x}" ${x===slot?'selected':''}>${SLOTN[x]}</option>`).join('')}</select></label>
    <p class="err" id="ce"></p><button class="btn block" id="cgo">Copy</button>`,{small:true});
  $('#cgo',sh.el).onclick=()=>{
    const d=$('#cd',sh.el).value,sl=$('#cs',sh.el).value;
    if(!d||d>today()){$('#ce',sh.el).textContent='Pick a date that is today or earlier.';return}
    const ids=src.map(e=>{const c=JSON.parse(JSON.stringify(e));delete c.pid;return addEntry(d,sl,c)});
    sh.close();toast(`Copied to ${fmtD(d)}`,()=>{const dd=DW(d);dd.entries=dd.entries.filter(e=>!ids.includes(e.id));save()});render();
  };
}

/* ===== actions ===== */
const ACTS={
  choose:t=>{S.cur=t.dataset.k;P=S.profiles[S.cur];V.view='home';V.date=today();V.pday=dow(today());V.sub={plan:'week',fit:'workouts',prog:'14'};V.wk='A';V.gw='A';V.mf='all';render()},
  switch:()=>{closeAll();S.cur=null;render()},
  nav:t=>{V.view=t.dataset.v;V.date=V.view==='diary'?V.date:V.date;render();window.scrollTo(0,0)},
  fab:()=>{
    const sh=sheet('Add',`<div class="qa"><button data-q="food">${ic('book')}Food</button><button data-q="water">${ic('drop')}Water</button><button data-q="weight">${ic('scale')}Weight</button><button data-q="ex">${ic('dumbbell')}Exercise</button></div>`,{small:true});
    sh.el.addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;const q=b.dataset.q;sh.close();
      if(q==='food')openPicker(diaryCtx(V.view==='diary'?V.date:today(),suggestSlot()));
      else if(q==='water'){const d=DW(V.view==='diary'?V.date:today());d.water+=250;save();toast('+250 ml water');render()}
      else if(q==='weight')weightSheet();else exerciseSheet(V.view==='diary'?V.date:today())});
  },
  homeadd:()=>openPicker(diaryCtx(today(),suggestSlot())),
  homewater:()=>{DW(today()).water+=250;save();toast('+250 ml water');render()},
  wlog:()=>weightSheet(),
  cinfo:t=>{const el=$('#cinfo');if(el)el.textContent=t.dataset.t},
  cinfo2:t=>{const el=$('#cinfo2');if(el)el.textContent=t.dataset.t},
  /* diary */
  dprev:()=>{V.date=addDays(V.date,-1);render()},
  dnext:()=>{if(V.date<today()){V.date=addDays(V.date,1);render()}},
  dtoday:()=>{V.date=today();render()},
  addfood:t=>openPicker(diaryCtx(V.date,t.dataset.s)),
  editentry:t=>entrySheet(V.date,t.dataset.id),
  copyyest:t=>{
    const s=t.dataset.s,src=D(addDays(V.date,-1)).entries.filter(e=>e.slot===s);
    const ids=src.map(e=>{const c=JSON.parse(JSON.stringify(e));delete c.pid;return addEntry(V.date,s,c)});
    toast(`Copied ${src.length} item${src.length>1?'s':''} from yesterday`,()=>{const d=DW(V.date);d.entries=d.entries.filter(e=>!ids.includes(e.id));save()});render();
  },
  slotsave:t=>saveSlotAsMeal(V.date,t.dataset.s),
  water:t=>{const d=DW(V.date);d.water=Math.max(0,d.water+num(t.dataset.n));save();render()},
  exadd:()=>exerciseSheet(V.date),
  exdel:t=>{const d=DW(V.date);d.ex=d.ex.filter(e=>e.id!==t.dataset.id);save();render()},
  /* plan */
  psub:t=>{V.sub.plan=t.dataset.v;render()},
  pday:t=>{V.pday=+t.dataset.d;render()},
  pm:t=>{const it=P.plan[V.pday][t.dataset.s].find(x=>x.id===t.dataset.id);if(it){it.mult=Math.max(.25,r1((it.mult+num(t.dataset.n))*100)/100);save();render()}},
  prm:t=>{const s=t.dataset.s,arr=P.plan[V.pday][s],it=arr.find(x=>x.id===t.dataset.id),ix=arr.indexOf(it);arr.splice(ix,1);save();toast('Removed from plan',()=>{P.plan[V.pday][s].splice(ix,0,it);save()});render()},
  padd:t=>openPicker(planCtx(V.pday,t.dataset.s)),
  pnew:t=>mealBuilder({slot:t.dataset.s,saveLabel:'Save meal and add to plan',onSave:m=>{pushPlan(V.pday,m.slot,m.id,1);toast(`${m.name} saved and added to ${DOW[V.pday]}`);render()}}),
  plog:t=>{
    const d=+t.dataset.d,s=t.dataset.s,it=P.plan[d][s].find(x=>x.id===t.dataset.id);if(!it)return;
    const id=logPlanItem(it,today(),s);
    toast('Logged to today',()=>{const dd=DW(today());dd.entries=dd.entries.filter(e=>e.id!==id);save()});render();
  },
  plogday:t=>{
    const d=+t.dataset.d,ids=[];
    for(const s of SLOTS)for(const it of P.plan[d][s])if(!planLogged(it,today())){const id=logPlanItem(it,today(),s);if(id)ids.push(id)}
    if(!ids.length){toast('Nothing new to log');return}
    toast(`Logged ${ids.length} item${ids.length>1?'s':''} to today`,()=>{const dd=DW(today());dd.entries=dd.entries.filter(e=>!ids.includes(e.id));save()});render();
  },
  pclear:async()=>{
    if(!await confirmBox(`Clear ${DOWL[V.pday]}?`,'This removes the planned meals for this day. Your saved meals are not affected.','Clear'))return;
    const old=P.plan[V.pday];P.plan[V.pday]={breakfast:[],lunch:[],dinner:[],snacks:[]};save();toast('Day cleared',()=>{P.plan[V.pday]=old;save()});render();
  },
  pauto:async()=>{
    if(P.plan.some(d=>SLOTS.some(s=>d[s].length))&&!await confirmBox('Build a new week?','This replaces your current week with meals picked from My meals to suit your goals. Your saved meals are not changed.','Build week',false))return;
    const old=P.plan;autoPlan();toast('New week built',()=>{P.plan=old;save()});render();
  },
  mf:t=>{V.mf=t.dataset.v;render()},
  mnew:()=>mealBuilder({}),
  medit:t=>mealBuilder({meal:mealById(t.dataset.id)}),
  mdel:async t=>{
    const m=mealById(t.dataset.id);if(!m)return;
    if(!await confirmBox('Delete meal?',`“${m.name}” will be removed from My meals and from your plan.`))return;
    const oldPlan=JSON.stringify(P.plan),ix=P.meals.indexOf(m);
    P.tomb[m.id]=Date.now();P.meals.splice(ix,1);P.plan.forEach(d=>SLOTS.forEach(s=>{d[s]=d[s].filter(x=>x.mid!==m.id)}));save();
    toast('Meal deleted',()=>{delete P.tomb[m.id];P.meals.splice(ix,0,m);P.plan=JSON.parse(oldPlan);save()});render();
  },
  mlog:t=>{
    const m=mealById(t.dataset.id);if(!m)return;
    const id=addEntry(today(),m.slot,entryFromMeal(m,1));
    toast(`${m.name} logged to ${SLOTN[m.slot].toLowerCase()}`,()=>{const dd=DW(today());dd.entries=dd.entries.filter(e=>e.id!==id);save()});render();
  },
  mplan:t=>{const m=mealById(t.dataset.id);if(m)planPickSheet(m)},
  fnew:()=>foodForm(()=>{toast('Food saved');render()},null),
  fedit:t=>foodForm(()=>{toast('Food updated');render()},P.foods.find(f=>f.key===t.dataset.id)),
  fdel:async t=>{
    const f=P.foods.find(x=>x.key===t.dataset.id);if(!f)return;
    if(!await confirmBox('Delete food?',`“${f.n}” will be removed from My foods. Meals that already use it keep their numbers.`))return;
    P.tomb[f.key]=Date.now();P.foods=P.foods.filter(x=>x!==f);save();render();
  },
  /* fitness */
  fsub:t=>{V.sub.fit=t.dataset.v;render()},
  fprog:t=>{P.workouts.program=t.dataset.v;save();render()},
  wk:t=>{V.wk=t.dataset.v;render()},
  gw:t=>{V.gw=t.dataset.w;fillGuide()},
  sstart:()=>sessionSheet(V.wk),
  sdel:async t=>{
    if(!await confirmBox('Delete workout?','This removes the workout from your history.'))return;
    P.tomb[t.dataset.id]=Date.now();P.workouts.sessions=P.workouts.sessions.filter(s=>s.id!==t.dataset.id);save();render();
  },
  /* progress */
  range:t=>{V.sub.prog=t.dataset.v;render()},
  wdel:t=>{const old=P.weights.find(w=>w.d===t.dataset.d);P.tomb['w:'+t.dataset.d]=Date.now();P.weights=P.weights.filter(w=>w.d!==t.dataset.d);save();toast('Weight removed',()=>{old.m=Date.now();P.weights.push(old);save()});render()},
  /* profile */
  theme:t=>{S.theme=t.dataset.v;save();render()},
  countex:t=>{P.prefs.countEx=t.dataset.v==='1';save();render()},
  savetargets:()=>{
    const k=num($('#tg_k').value),p=num($('#tg_p').value),c=num($('#tg_c').value),f=num($('#tg_f').value),w=num($('#tg_w').value);
    if(k<800||k>6000||p<0||c<0||f<0||w<500){toast('Check your numbers');return}
    P.targets={k:r0(k),p:r0(p),c:r0(c),f:r0(f),water:r0(w)};save();toast('Goals saved');render();
  },
  savestats:()=>{P.stats=readStats();save();toast('Details saved');render()},
  recalc:()=>{
    const st=readStats(),t=calcTargets(st),e=$('#serr');
    if(!t){e.textContent='Enter your age, height and weight first.';return}
    P.stats=st;P.targets={k:t.k,p:t.p,c:t.c,f:t.f,water:P.targets.water||2500};save();toast(`New goal: ${nf(t.k)} kcal`);render();
  },
  export:()=>exportSheet(),
  import:()=>importSheet(),
  resetp:async()=>{
    if(!await confirmBox(`Reset ${PROFILES[S.cur].name}’s data?`,'This deletes this profile’s diary, meals, plan, weights and workouts. The other profile is not touched. Back up first if you are unsure.','Reset everything'))return;
    S.profiles[S.cur]=seedProfile(S.cur);P=S.profiles[S.cur];P.rs=Date.now();save();V.view='home';toast('Profile reset');render();
  },
  gosync:()=>{V.view='me';render();const c=$('#synccard');if(c)c.scrollIntoView({block:'start'})},
  synchide:()=>{S.syncHint=false;persist();render()},
  copyto:t=>copyToSheet(t.dataset.s),
  pcopy:()=>copyDaySheet(),
  shoprange:t=>{V.shopRange=t.dataset.v;render()},
  shopck:t=>{P.shop=P.shop||{checked:{}};if(t.checked)P.shop.checked[t.dataset.k]=1;else delete P.shop.checked[t.dataset.k];persist();render()},
  shopreset:()=>{P.shop={checked:{}};persist();render()},
  shopcopy:async()=>{
    const gs=shopData(V.shopRange||'week');
    const txt='Shopping list\n'+gs.map(g=>'\n'+g.cat+'\n'+g.items.map(i=>'- '+i.name+' '+shopQty(i)).join('\n')).join('\n');
    try{await navigator.clipboard.writeText(txt);toast('List copied')}
    catch(e){const sh=sheet('Shopping list',`<textarea id="sx" readonly rows="14">${esc(txt)}</textarea>`);$('#sx',sh.el).select()}
  },
  aisave:()=>{const v=($('#ai_key').value||'').trim();if(!/^sk-ant-/.test(v)){$('#ai_err').textContent='That does not look like an Anthropic key. It starts with sk-ant-';return}S.ai.key=v;persist();toast('Key saved on this device');render()},
  aiclear:()=>{S.ai.key='';persist();toast('Key removed');render()},
  remtog:t=>{const r=remGet();r[t.dataset.k].on=t.checked;P.prefs.rem=r;save();render()},
  remdl:()=>remSheet(),
  nudge:t=>{P.prefs.nudge=t.dataset.v==='1';save();render()},
  nudgeadd:t=>openPicker(diaryCtx(today(),t.dataset.s)),
  /* sync */
  syncon:()=>{
    const url=$('#sy_url').value.trim(),code=$('#sy_code').value.trim(),e=$('#sy_err');
    const bad=validSyncUrl(url);if(bad){e.textContent=bad;return}
    if(code.length<8){e.textContent='The sync code must be at least 8 characters.';return}
    S.sync={url:url.replace(/\/+$/,''),code,on:true,last:0,err:''};persist();syncNow(true);render();
  },
  syncoff:()=>{S.sync.on=false;persist();render();toast('Sync turned off on this device')},
  syncnow:()=>{syncNow(true);toast('Syncing…')},
  syncgen:()=>{$('#sy_code').value=genCode()},
  syncsteps:()=>syncSteps(),
  synclink:()=>syncLinkSheet(),
  /* setup */
  setupdone:()=>{
    const st=readStats(),t=calcTargets(st),e=$('#serr');
    if(!t){e.textContent='Please enter your age, height and weight, or choose “skip” below.';return}
    if(st.age<14||st.age>90||st.height<120||st.height>230||st.weight<35||st.weight>250){e.textContent='Check your age, height (cm) and weight (kg).';return}
    P.stats=st;P.targets={k:t.k,p:t.p,c:t.c,f:t.f,water:2500};P.onboarded=true;if(st.goal==='tone'&&!P.workouts.sessions.length)P.workouts.program='tone';
    if(st.weight)P.weights.push({d:today(),v:st.weight,m:Date.now()});
    autoPlan();save();V.view='plan';V.sub.plan='week';toast('Your plan is ready');render();
  },
  setupskip:()=>{P.onboarded=true;autoPlan();save();V.view='home';render()}
};
function boot(){
  initStore();
  initSync();
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
    const f=ACTS[t.dataset.act];if(f){if(t.tagName!=='INPUT')e.preventDefault();f(t,e)}
  });
  document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#setupform'))updateSetupPreview()});
  document.addEventListener('change',e=>{if(e.target.id==='st_goal'){const n=$('#goalnote');if(n)n.textContent=goalNote(e.target.value)}
    const k=e.target.dataset&&e.target.dataset.rem;if(k&&e.target.value){const r=remGet();r[k].t=e.target.value;P.prefs.rem=r;save()}});
  document.addEventListener('change',e=>{if(e.target.closest&&e.target.closest('#setupform'))updateSetupPreview()});
  matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='auto')applyTheme()});
  window.addEventListener('beforeunload',()=>{try{save()}catch(e){}});
  render();
}
boot();
